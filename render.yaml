databases:
  - name: bidders-nepal-db
    plan: free
    databaseName: bidders_nepal
    user: bidders_nepal_user

services:
  - type: web
    name: bidders-nepal-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: bidders-nepal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_COOKIE_SECURE
        value: "true"
      - key: ENABLE_TENDER_COLLECTOR
        value: "true"
      - key: TENDER_PRIORITY_INTERVAL_MINUTES
        value: "20"
      - key: TENDER_TIMEZONE
        value: "Asia/Kathmandu"
      - key: TENDER_PROBE_DOCUMENTS
        value: "true"
      - key: TENDER_LOCAL_DISCOVERY
        value: "true"
      - key: TENDER_PRIORITY_SOURCE_LIMIT
        value: "24"
      - key: TENDER_FULL_SOURCE_LIMIT
        value: "120"
